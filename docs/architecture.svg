<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" font-family="Segoe UI, Arial, sans-serif">
  <title>Singleton — architecture: Aurora DSQL + Next.js on Vercel (FCFS + commit-reveal lottery)</title>

  <defs>
    <marker id="ah-g" viewBox="0 0 10 10" markerWidth="9" markerHeight="9" refX="8" refY="5" orient="auto-start-reverse">
      <path d="M0,1.5 L8,5 L0,8.5 Z" fill="#737373"/>
    </marker>
    <marker id="ah-i" viewBox="0 0 10 10" markerWidth="9" markerHeight="9" refX="8" refY="5" orient="auto-start-reverse">
      <path d="M0,1.5 L8,5 L0,8.5 Z" fill="#4f46e5"/>
    </marker>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1600" height="1000" fill="#ffffff"/>

  <!-- ===================== title block ===================== -->
  <rect x="40" y="42" width="6" height="46" rx="3" fill="#4f46e5"/>
  <text x="62" y="68" font-size="26" font-weight="600" fill="#171717">Singleton</text>
  <text x="62" y="93" font-size="14" fill="#737373">Provably-fair, multi-tenant allocation marketplace — FCFS claims · commit-reveal lottery — Amazon Aurora DSQL + Next.js on Vercel</text>

  <!-- legend (top right) -->
  <line x1="1300" y1="56" x2="1342" y2="56" stroke="#4f46e5" stroke-width="1.5" marker-end="url(#ah-i)"/>
  <text x="1352" y="60" font-size="11.5" fill="#737373">primary connection</text>
  <line x1="1300" y1="80" x2="1342" y2="80" stroke="#737373" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#ah-g)"/>
  <text x="1352" y="84" font-size="11.5" fill="#737373">failover / secondary</text>

  <!-- ===================== clients zone ===================== -->
  <rect x="40" y="140" width="260" height="560" rx="12" fill="#fafafa" stroke="#e5e5e5" stroke-width="1"/>
  <text x="56" y="168" font-size="15.5" font-weight="600" fill="#171717">Clients</text>
  <text x="56" y="187" font-size="12" fill="#737373">browsers + scripts</text>

  <rect x="56" y="230" width="228" height="88" rx="10" fill="#ffffff" stroke="#e5e5e5" stroke-width="1"/>
  <text x="72" y="256" font-size="13.5" font-weight="600" fill="#171717">Claimants</text>
  <text x="72" y="278" font-size="12.5" fill="#737373">thousands, concurrent —</text>
  <text x="72" y="297" font-size="12.5" fill="#737373">claim (FCFS) or enter the draw</text>

  <rect x="56" y="372" width="228" height="88" rx="10" fill="#ffffff" stroke="#e5e5e5" stroke-width="1"/>
  <text x="72" y="400" font-size="13.5" font-weight="600" fill="#171717">Operators + platform admin</text>
  <text x="72" y="421" font-size="12" fill="#737373">operators: create/delete their own (key)</text>
  <text x="72" y="439" font-size="12" fill="#737373">platform admin: manage all (token)</text>

  <rect x="56" y="514" width="228" height="88" rx="10" fill="#ffffff" stroke="#e5e5e5" stroke-width="1"/>
  <text x="72" y="540" font-size="13.5" font-weight="600" fill="#171717">Stress harness</text>
  <text x="72" y="562" font-size="12" font-family="Consolas, monospace" fill="#737373">scripts/stress.ts</text>
  <text x="72" y="581" font-size="12.5" fill="#737373">3,000 claims or entries / run</text>

  <!-- client → vercel arrows -->
  <text x="319" y="265" font-size="10.5" fill="#737373" text-anchor="middle">HTTPS</text>
  <line x1="284" y1="274" x2="350" y2="274" stroke="#737373" stroke-width="1.2" marker-end="url(#ah-g)"/>
  <text x="319" y="407" font-size="10.5" fill="#737373" text-anchor="middle">HTTPS</text>
  <line x1="284" y1="416" x2="350" y2="416" stroke="#737373" stroke-width="1.2" marker-end="url(#ah-g)"/>
  <text x="319" y="549" font-size="10.5" fill="#737373" text-anchor="middle">HTTPS</text>
  <line x1="284" y1="558" x2="350" y2="558" stroke="#737373" stroke-width="1.2" marker-end="url(#ah-g)"/>

  <!-- ===================== vercel panel ===================== -->
  <rect x="360" y="140" width="490" height="560" rx="12" fill="#fafafa" stroke="#e5e5e5" stroke-width="1"/>
  <path d="M384,154 L392,168 L376,168 Z" fill="#171717"/>
  <text x="400" y="168" font-size="15.5" font-weight="600" fill="#171717">Vercel</text>
  <text x="376" y="190" font-size="12" fill="#737373">Next.js 15 App Router · Node.js runtime · iad1 (us-east-1)</text>

  <!-- react ui -->
  <rect x="376" y="204" width="458" height="116" rx="10" fill="#ffffff" stroke="#e5e5e5" stroke-width="1"/>
  <text x="392" y="226" font-size="13.5" font-weight="600" fill="#171717">React UI <tspan fill="#737373" font-weight="400">(filterable marketplace, mode-aware)</tspan></text>
  <text x="392" y="248" font-size="12" fill="#171717"><tspan font-family="Consolas, monospace">/</tspan><tspan fill="#737373"> — catalog with category/type/status filters · </tspan><tspan font-family="Consolas, monospace">/releases/[id]</tspan></text>
  <text x="392" y="268" font-size="12" fill="#171717"><tspan font-family="Consolas, monospace">/receipt/[id]</tspan><tspan fill="#737373"> — rank #n of N · lottery entry id</tspan></text>
  <text x="392" y="288" font-size="12" fill="#171717"><tspan font-family="Consolas, monospace">/verify/[id]</tspan><tspan fill="#737373"> — ledger · draw proof · in-browser re-run → MATCH</tspan></text>
  <text x="392" y="308" font-size="12" fill="#171717"><tspan font-family="Consolas, monospace">/admin</tspan><tspan fill="#737373"> — operators + admin: create, delete own, run draw, burst</tspan></text>

  <!-- api route handlers -->
  <rect x="376" y="336" width="458" height="152" rx="10" fill="#ffffff" stroke="#e5e5e5" stroke-width="1"/>
  <text x="392" y="358" font-size="13.5" font-weight="600" fill="#171717">API route handlers <tspan fill="#737373" font-weight="400">(app/api)</tspan></text>
  <text x="392" y="382" font-size="12.5" font-family="Consolas, monospace" fill="#171717"><tspan font-weight="600" fill="#737373">POST</tspan> /releases/[id]/claim</text>
  <rect x="578" y="369" width="80" height="19" rx="9.5" fill="#eef2ff" stroke="#4f46e5" stroke-width="1"/>
  <text x="618" y="382" font-size="11" font-weight="600" fill="#4f46e5" text-anchor="middle">the heart</text>
  <text x="392" y="402" font-size="12.5" font-family="Consolas, monospace" fill="#171717"><tspan font-weight="600" fill="#737373">POST</tspan> /releases/[id]/enter</text>
  <rect x="578" y="389" width="86" height="19" rx="9.5" fill="#eef2ff" stroke="#4f46e5" stroke-width="1"/>
  <text x="621" y="402" font-size="11" font-weight="600" fill="#4f46e5" text-anchor="middle">equal odds</text>
  <text x="392" y="422" font-size="12.5" font-family="Consolas, monospace" fill="#171717"><tspan font-weight="600" fill="#737373">POST</tspan> /releases/[id]/draw (owner) · <tspan font-weight="600" fill="#737373">DELETE</tspan> /releases/[id]</text>
  <text x="392" y="442" font-size="12.5" font-family="Consolas, monospace" fill="#171717"><tspan font-weight="600" fill="#737373">GET</tspan> …/state · <tspan font-weight="600" fill="#737373">GET</tspan> …/ledger · <tspan font-weight="600" fill="#737373">GET</tspan> …/draw-proof · /health</text>
  <text x="392" y="462" font-size="12.5" font-family="Consolas, monospace" fill="#171717"><tspan font-weight="600" fill="#737373">POST</tspan> /releases/[id]/simulate (admin) · <tspan font-weight="600" fill="#737373">POST</tspan> /providers</text>
  <text x="392" y="481" font-size="11.5" fill="#737373">authz: <tspan font-family="Consolas, monospace" fill="#171717">resolveActor</tspan> → platform (token) · provider (key) · owner-scoped writes</text>

  <!-- data + domain layer -->
  <rect x="376" y="504" width="458" height="182" rx="10" fill="#ffffff" stroke="#e5e5e5" stroke-width="1"/>
  <text x="392" y="526" font-size="13.5" font-weight="600" fill="#171717">Data + domain layer <tspan fill="#737373" font-weight="400" font-family="Consolas, monospace">(src/)</tspan></text>
  <circle cx="386" cy="546" r="2" fill="#737373"/>
  <text x="396" y="550" font-size="12.5" fill="#171717">claim + draw transactions — idempotent, sharded</text>
  <text x="396" y="568" font-size="12.5" fill="#171717">counter; draw scores = sha256(seed + ":" + entryId)</text>
  <circle cx="386" cy="588" r="2" fill="#737373"/>
  <text x="396" y="592" font-size="12.5" fill="#171717"><tspan font-family="Consolas, monospace">withRetry</tspan> — OCC SQLSTATE 40001 / OC000</text>
  <text x="396" y="610" font-size="12.5" fill="#171717">→ retry ≤8× expo backoff + jitter</text>
  <circle cx="386" cy="630" r="2" fill="#737373"/>
  <text x="396" y="634" font-size="12.5" fill="#171717"><tspan font-family="Consolas, monospace">AuroraDSQLPool</tspan> singleton — fresh IAM token</text>
  <text x="396" y="652" font-size="12.5" fill="#171717">per connection, no static password;</text>
  <text x="396" y="670" font-size="12.5" fill="#171717"><tspan font-family="Consolas, monospace">attachDatabasePool</tspan> (Fluid Compute)</text>

  <!-- ===================== vercel → aws connections ===================== -->
  <text x="926" y="238" font-size="11" fill="#4f46e5" text-anchor="middle">PostgreSQL wire + TLS</text>
  <text x="926" y="253" font-size="11" fill="#4f46e5" text-anchor="middle">IAM auth token</text>
  <line x1="850" y1="265" x2="1002" y2="265" stroke="#4f46e5" stroke-width="1.5" marker-end="url(#ah-i)"/>

  <text x="926" y="412" font-size="11" fill="#737373" text-anchor="middle">failover / locality</text>
  <line x1="850" y1="426" x2="1002" y2="426" stroke="#737373" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#ah-g)"/>

  <!-- ===================== aws panel ===================== -->
  <rect x="1010" y="140" width="550" height="560" rx="12" fill="#fafafa" stroke="#e5e5e5" stroke-width="1"/>
  <rect x="1026" y="154" width="4" height="18" rx="2" fill="#ff9900"/>
  <text x="1040" y="168" font-size="15.5" font-weight="600" fill="#171717">AWS</text>
  <text x="1026" y="190" font-size="12" fill="#737373">Amazon Aurora DSQL · serverless · strongly consistent · active-active</text>

  <!-- us-east-1 -->
  <rect x="1026" y="210" width="518" height="138" rx="10" fill="#ffffff" stroke="#e5e5e5" stroke-width="1.5"/>
  <text x="1042" y="234" font-size="13.5" font-weight="600" fill="#171717">us-east-1 · primary endpoint (read + write)</text>
  <rect x="1042" y="248" width="76" height="24" rx="12" fill="#fafafa" stroke="#e5e5e5" stroke-width="1"/>
  <text x="1080" y="264" font-size="11.5" font-family="Consolas, monospace" fill="#171717" text-anchor="middle">providers</text>
  <rect x="1128" y="248" width="70" height="24" rx="12" fill="#fafafa" stroke="#e5e5e5" stroke-width="1"/>
  <text x="1163" y="264" font-size="11.5" font-family="Consolas, monospace" fill="#171717" text-anchor="middle">releases</text>
  <rect x="1208" y="248" width="136" height="24" rx="12" fill="#fafafa" stroke="#e5e5e5" stroke-width="1"/>
  <text x="1276" y="264" font-size="11.5" font-family="Consolas, monospace" fill="#171717" text-anchor="middle">release_shards ×32</text>
  <text x="1354" y="264" font-size="11" fill="#737373">(sharded counter)</text>
  <rect x="1042" y="280" width="90" height="24" rx="12" fill="#fafafa" stroke="#e5e5e5" stroke-width="1"/>
  <text x="1087" y="296" font-size="11.5" font-family="Consolas, monospace" fill="#171717" text-anchor="middle">allocations</text>
  <rect x="1142" y="280" width="70" height="24" rx="12" fill="#fafafa" stroke="#e5e5e5" stroke-width="1"/>
  <text x="1177" y="296" font-size="11.5" font-family="Consolas, monospace" fill="#171717" text-anchor="middle">waitlist</text>
  <rect x="1222" y="280" width="116" height="24" rx="12" fill="#fafafa" stroke="#e5e5e5" stroke-width="1"/>
  <text x="1280" y="296" font-size="11.5" font-family="Consolas, monospace" fill="#171717" text-anchor="middle">release_meta</text>
  <rect x="1042" y="312" width="116" height="24" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="1"/>
  <text x="1100" y="328" font-size="11.5" font-family="Consolas, monospace" fill="#171717" text-anchor="middle">lottery_config</text>
  <rect x="1168" y="312" width="66" height="24" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="1"/>
  <text x="1201" y="328" font-size="11.5" font-family="Consolas, monospace" fill="#171717" text-anchor="middle">entries</text>
  <text x="1244" y="328" font-size="11" fill="#737373">(mode B: committed seed + entry window)</text>

  <!-- peering: one logical db -->
  <line x1="1100" y1="356" x2="1100" y2="384" stroke="#4f46e5" stroke-width="1.5" marker-start="url(#ah-i)" marker-end="url(#ah-i)"/>
  <text x="1122" y="374" font-size="11.5" fill="#4f46e5">one logical DB — synchronous, strongly consistent</text>

  <!-- us-east-2 -->
  <rect x="1026" y="388" width="518" height="76" rx="10" fill="#ffffff" stroke="#e5e5e5" stroke-width="1"/>
  <text x="1042" y="414" font-size="13.5" font-weight="600" fill="#171717">us-east-2 · peered endpoint (read + write)</text>
  <text x="1042" y="438" font-size="12.5" fill="#737373">same logical database</text>

  <!-- link to witness -->
  <line x1="1100" y1="468" x2="1100" y2="516" stroke="#737373" stroke-width="1.2" stroke-dasharray="4 4"/>

  <!-- us-west-2 witness -->
  <rect x="1026" y="520" width="518" height="76" rx="10" fill="#ffffff" stroke="#e5e5e5" stroke-width="1"/>
  <text x="1042" y="546" font-size="13.5" font-weight="600" fill="#171717">us-west-2 · witness region</text>
  <text x="1042" y="570" font-size="12.5" fill="#737373">transaction-log quorum, no endpoint</text>

  <text x="1285" y="638" font-size="11.5" fill="#737373" text-anchor="middle">active-active: both endpoints serve strongly consistent reads + writes</text>
  <text x="1285" y="658" font-size="11" fill="#737373" text-anchor="middle">providers.api_key → per-operator auth · release_meta → branding, poster, category</text>

  <!-- ===================== bottom strip: claim transaction (mode A) ===================== -->
  <rect x="40" y="732" width="630" height="224" rx="12" fill="#fafafa" stroke="#e5e5e5" stroke-width="1"/>
  <text x="64" y="766" font-size="15.5" font-weight="600" fill="#171717">The claim — Mode A <tspan fill="#737373" font-weight="400" font-size="12.5">(one ACID transaction)</tspan></text>

  <line x1="68" y1="794" x2="68" y2="902" stroke="#c7d2fe" stroke-width="1.5"/>
  <circle cx="68" cy="794" r="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1"/>
  <text x="68" y="798" font-size="11" font-weight="600" fill="#4f46e5" text-anchor="middle">1</text>
  <circle cx="68" cy="826" r="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1"/>
  <text x="68" y="830" font-size="11" font-weight="600" fill="#4f46e5" text-anchor="middle">2</text>
  <circle cx="68" cy="870" r="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1"/>
  <text x="68" y="874" font-size="11" font-weight="600" fill="#4f46e5" text-anchor="middle">3</text>
  <circle cx="68" cy="902" r="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1"/>
  <text x="68" y="906" font-size="11" font-weight="600" fill="#4f46e5" text-anchor="middle">4</text>

  <text x="92" y="798" font-size="12" font-family="Consolas, monospace" fill="#171717">BEGIN</text>
  <text x="92" y="830" font-size="12" font-family="Consolas, monospace" fill="#171717">UPDATE release_shards SET remaining = remaining − 1</text>
  <text x="92" y="848" font-size="12" font-family="Consolas, monospace" fill="#171717">  WHERE … shard_index = $2 <tspan font-weight="600" fill="#4f46e5">AND remaining &gt; 0</tspan> RETURNING id</text>
  <text x="92" y="874" font-size="12" font-family="Consolas, monospace" fill="#171717">INSERT INTO allocations (…, claimant_id, shard_id, idem_key)</text>
  <text x="92" y="906" font-size="12" font-family="Consolas, monospace" fill="#171717">COMMIT</text>

  <text x="92" y="938" font-size="12" fill="#737373">on OCC conflict (<tspan font-family="Consolas, monospace">40001</tspan>/<tspan font-family="Consolas, monospace">OC000</tspan>): retry whole claim with backoff</text>

  <!-- ===================== bottom strip: the draw (mode B) ===================== -->
  <rect x="690" y="732" width="350" height="224" rx="12" fill="#fafafa" stroke="#e5e5e5" stroke-width="1"/>
  <text x="714" y="766" font-size="15.5" font-weight="600" fill="#171717">The draw — Mode B <tspan fill="#737373" font-weight="400" font-size="12.5">(one ACID txn)</tspan></text>

  <line x1="718" y1="794" x2="718" y2="890" stroke="#c7d2fe" stroke-width="1.5"/>
  <circle cx="718" cy="794" r="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1"/>
  <text x="718" y="798" font-size="11" font-weight="600" fill="#4f46e5" text-anchor="middle">1</text>
  <circle cx="718" cy="826" r="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1"/>
  <text x="718" y="830" font-size="11" font-weight="600" fill="#4f46e5" text-anchor="middle">2</text>
  <circle cx="718" cy="858" r="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1"/>
  <text x="718" y="862" font-size="11" font-weight="600" fill="#4f46e5" text-anchor="middle">3</text>
  <circle cx="718" cy="890" r="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1"/>
  <text x="718" y="894" font-size="11" font-weight="600" fill="#4f46e5" text-anchor="middle">4</text>

  <text x="742" y="798" font-size="12" fill="#171717">score entries: <tspan font-family="Consolas, monospace">sha256(seed + ":" + entryId)</tspan></text>
  <text x="742" y="830" font-size="12" fill="#171717">take <tspan font-family="Consolas, monospace">capacity</tspan> lowest (tie-break: entryId)</text>
  <text x="742" y="862" font-size="12" fill="#171717">consume shards · <tspan font-family="Consolas, monospace">INSERT 'draw:'+entryId</tspan></text>
  <text x="742" y="894" font-size="12" fill="#171717">set <tspan font-family="Consolas, monospace">drawn_at</tspan> once · seed revealed</text>

  <text x="742" y="938" font-size="12" fill="#4f46e5">seed hash committed before entries open —</text>
  <text x="742" y="954" font-size="12" fill="#4f46e5">anyone can re-run the draw in-browser → MATCH</text>

  <!-- ===================== invariant chips ===================== -->
  <text x="1070" y="766" font-size="15.5" font-weight="600" fill="#171717">Invariants <tspan fill="#737373" font-weight="400" font-size="12.5">— always hold, publicly verifiable</tspan></text>

  <rect x="1070" y="786" width="118" height="32" rx="16" fill="#ffffff" stroke="#4f46e5" stroke-width="1"/>
  <text x="1084" y="807" font-size="12.5" font-family="Consolas, monospace" fill="#171717">oversells = 0</text>

  <rect x="1070" y="828" width="173" height="32" rx="16" fill="#ffffff" stroke="#4f46e5" stroke-width="1"/>
  <text x="1084" y="849" font-size="12.5" font-family="Consolas, monospace" fill="#171717">≤ 1 slot per claimant</text>

  <rect x="1070" y="870" width="242" height="32" rx="16" fill="#ffffff" stroke="#4f46e5" stroke-width="1"/>
  <text x="1084" y="891" font-size="12.5" font-family="Consolas, monospace" fill="#171717">ranks derived · 1..N contiguous</text>

  <rect x="1070" y="912" width="283" height="32" rx="16" fill="#ffffff" stroke="#4f46e5" stroke-width="1"/>
  <text x="1084" y="933" font-size="12.5" font-family="Consolas, monospace" fill="#171717">SUM(remaining) + allocated = capacity</text>

  <rect x="1363" y="912" width="197" height="32" rx="16" fill="#ffffff" stroke="#4f46e5" stroke-width="1"/>
  <text x="1377" y="933" font-size="12.5" font-family="Consolas, monospace" fill="#171717">draw re-derives from seed</text>
</svg>
